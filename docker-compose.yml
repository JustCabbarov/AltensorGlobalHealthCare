version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: altensor-global-healthcare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: altensor_global_healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_healthcare_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d altensor_global_healthcare_db"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: altensor-global-healthcare-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=altensor_global_healthcare_db;Username=postgres;Password=postgres
    volumes:
      - api_uploads:/app/wwwroot/uploads
      - api_secure_docs:/app/App_Data/medical-docs

volumes:
  postgres_healthcare_data:
  api_uploads:
  api_secure_docs:

